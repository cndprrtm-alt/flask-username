<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Aplikasi Cek Username{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('beranda') }}">
                Cek Username
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('beranda') }}">Beranda</a>
                <a class="nav-link" href="{{ url_for('tentang') }}">Tentang</a>
                <a class="nav-link" href="{{ url_for('produk') }}">Produk</a>
                <a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center bg-light text-muted py-3">
        &copy; 2026 Aplikasi Cek Username
    </footer>

<li class="nav-item">
    <a class="nav-link" href="{{ url_for('daftar_username') }}">
        Daftar Username
    </a>
</li>

</body>
</html>
